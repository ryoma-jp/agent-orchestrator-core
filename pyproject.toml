[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-orchestrator-core"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.20,<2",
  "asyncpg>=0.32,<1",
  "email-validator>=2.3,<3",
  "fastapi>=0.148,<1",
  "hvac>=2.4,<3",
  "httpx>=0.28.1,<1",
  "openai==3.35.1",
  "openai-agents==0.24.0",
  "pydantic==2.14.1",
  "pwdlib[argon2]>=0.3.1,<1",
  "pydantic-settings>=2.15,<3",
  "sqlalchemy[asyncio]>=2.0.54,<2.1",
  "uvicorn[standard]>=0.54,<1",
]

[project.optional-dependencies]
dev = [
  "black>=26.10.1,<27",
  "httpx2>=2.14.0,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 79
target-version = "py310"
